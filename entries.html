<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EnzoCare</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app-container">

        <h3>Einträge</h3>

        <!-- Filterbuttons -->
        <div class="filter-buttons">

            <div class="filter-row">
                <button onclick="filterEntries('all', this)" class="filter-btn all">Alle</button>
                <button onclick="filterEntries('Spritze', this)" class="filter-btn Spritze">Spritze</button>
                <button onclick="filterEntries('Medikamente', this)" class="filter-btn Medikamente">Medikamente</button>            
                <button onclick="filterEntries('Arztbesuch', this)" class="filter-btn Arztbesuch">Arztbesuch</button>
                <button onclick="filterEntries('Zittern', this)" class="filter-btn Zittern">Zittern</button>  
                <button onclick="filterEntries('Stress', this)" class="filter-btn Stress">Stress</button>
            </div>
                
            <div class="filter-row">

                
                <button onclick="filterEntries('Blasenschwäche', this)" class="filter-btn Blasenschwäche">Blasenschwäche</button>            
                <button onclick="filterEntries('Verlängertes Wasserlassen', this)" class="filter-btn Verlängertes-Wasserlassen">verlängertes Wasserlassen</button>
                <button onclick="filterEntries('Trinkverhalten', this)" class="filter-btn Trinkverhalten">Trinkverhalten</button>
            </div>

        </div>

        <div id="entriesList"></div>

    </main>
    <!-- Zurück-Button-->
    <button class="back-button" onclick="window.location.href='index.html'">
        Zurück
    </button>

    <script src="entries.js"></script>


</body>

</html>
