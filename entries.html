<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0"
    >

    <title>EnzoCare</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>

    <main class="app-container">

        <h3>Einträge</h3>

        <!-- Filter -->
        <div class="filter-buttons">

            <div class="filter-row">

                <button 
                    class="filter-btn all"
                    data-tag="all"
                >
                    Alle
                </button>

                <button 
                    class="filter-btn spritze"
                    data-tag="spritze"
                >
                    Spritze
                </button>
                
                <button
                    class="filter-btn medikamente"
                    data-tag="medikamente"
                >
                    Medikamente
                </button>

                <button
                    class="filter-btn arztbesuch"
                    data-tag="arztbesuch"
                >
                    Arztbesuch
                </button>

                <button
                    class="filter-btn zittern"
                    data-tag="zittern"
                >
                    Zittern
                </button>

                <button
                    class="filter-btn stress"
                    data-tag="stress"
                >
                    Stress
                </button>

            </div>
                
            <div class="filter-row">

                <button
                    class="filter-btn blasenschwaeche"
                    data-tag="blasenschwaeche"
                >
                    Blasenschwäche
                </button>

                <button
                    class="filter-btn verlaengertes-wasserlassen"
                    data-tag="verlaengertes-wasserlassen"
                >
                    Verlängertes Wasserlassen
                </button>

                <button
                    class="filter-btn trinkverhalten"
                    data-tag="trinkverhalten"
                >
                    Trinkverhalten
                </button>
            </div>

        </div>

        <!-- Einträge -->

        <div id="entriesList"></div>

    </main>

    <!-- Zurück-Button -->
    <button
        class="back-button"
        id="backButton"
    >
        Zurück
    </button>
    <script src="storage.js"></script>
    <script src="entries.js"></script>

</body>

</html>
